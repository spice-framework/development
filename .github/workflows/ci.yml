name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    uses: spice-framework/.github/.github/workflows/go-verify.yml@70dad5db693e53d725af99e7eed6b111b8d25388
    with:
      go-version: 1.26.5
      cache: false

  complete:
    name: Complete repository gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Go 1.26.5
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.5
          cache: false
      - name: Verify exact tree
        run: go run ./internal/qualitygate
